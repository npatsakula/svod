[package]
name = "svod-schedule"

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Optimization passes and pattern engine for the Svod ML compiler"
readme = "README.md"

[dependencies]
svod-ir = { path = "../ir", version = "=0.1.0-alpha.6" }
svod-dtype = { path = "../dtype", version = "=0.1.0-alpha.6" }
svod-device = { path = "../device", version = "=0.1.0-alpha.6" }
svod-macros = { path = "../macros", version = "=0.1.0-alpha.6" }
smallvec = { workspace = true, features = ["union"] }
once_cell = "1.21"
sled = "0.34"
dirs = "6.0"
bon = "3.8"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

z3 = { version = "0.19", optional = true }
proptest-derive = { version = "0.7", optional = true }
snafu = "0.8.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "json",
], optional = true }
itertools = "0.14.0"
indexmap = "2.13.0"
rustc-hash = "2.1.3"

[features]
default = []
testing = ["dep:tracing-subscriber"]
z3 = ["dep:z3"]
proptest = ["dep:proptest-derive", "svod-ir/proptest"]
serde = ["svod-ir/serde"]
# Enable trace-level spans in hot paths (compile-time control)
tracing-verbose = []

[dev-dependencies]
proptest = "1.9.0"
svod-ir = { path = "../ir", version = "=0.1.0-alpha.6", features = [
  "proptest",
] }
test-case = "3.3.1"
