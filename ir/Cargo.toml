[package]
name = "svod-ir"

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Intermediate representation for the Svod ML compiler"
readme = "README.md"

[dependencies]
svod-dtype = { path = "../dtype", version = "=0.2.0", features = [
  "serde",
] }
svod-macros = { path = "../macros", version = "=0.2.0" }
smallvec = { workspace = true, features = ["serde"] }
snafu = "0.9"
proptest = { version = "1.9.0", optional = true }
half = { version = "2.7.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
derive_more = { version = "2.1", features = ["debug", "display", "from"] }
libm = "0.2.15"
papaya = "0.2.3"
tracing = "0.1"
strum = { version = "0.28", features = ["derive"] }
xxhash-rust = { version = "0.8.15", features = ["xxh64"] }
bon = "3.10"
rustc-hash = "2.1.3"
bincode = { version = "2", features = ["serde"] }

[dev-dependencies]
half = "2.7.1"
svod-dtype = { path = "../dtype", version = "=0.2.0", features = ["proptest"] }
proptest = "1.9.0"
test-case = "3.3.1"

[features]
proptest = ["dep:proptest", "dep:half", "svod-dtype/proptest"]
