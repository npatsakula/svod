name: CI

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  nix-checks:
    name: Nix Flake Checks
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: DeterminateSystems/determinate-nix-action@v3.22.3

      - uses: DeterminateSystems/flakehub-cache-action@main

      - name: Run flake checks
        run: nix flake check --print-build-logs

  flake-health:
    name: Flake Health
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/flake-checker-action@main

  publish:
    name: Publish crates
    needs: [nix-checks, flake-health]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/determinate-nix-action@v3.22.3

      - uses: DeterminateSystems/flakehub-cache-action@main

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish_crate() {
            local crate="$1"
            local output
            if output=$(nix develop --command cargo publish -p "$crate" --no-verify 2>&1); then
              echo "$crate: published"
            elif echo "$output" | grep -q "already exists"; then
              echo "$crate: already published, skipping"
            else
              echo "$output" >&2
              return 1
            fi
          }

          wait_for_crate() {
            local crate="$1"
            local version="$2"
            local timeout=300
            local elapsed=0
            echo "Waiting for $crate@$version to appear on crates.io..."
            while [ $elapsed -lt $timeout ]; do
              if curl -sf -H "User-Agent: svod-ci (github.com/npatsakula/svod)" "https://crates.io/api/v1/crates/$crate/$version" > /dev/null 2>&1; then
                echo "$crate@$version is available"
                return 0
              fi
              sleep 15
              elapsed=$((elapsed + 15))
            done
            echo "::error::Timed out waiting for $crate@$version"
            return 1
          }

          VERSION="${GITHUB_REF#refs/tags/v}"

          # L0: no internal deps
          publish_crate svod-dtype &
          publish_crate svod-macros &
          wait
          wait_for_crate svod-dtype "$VERSION"
          wait_for_crate svod-macros "$VERSION"

          # L1
          publish_crate svod-ir
          wait_for_crate svod-ir "$VERSION"

          # L2
          publish_crate svod-device
          wait_for_crate svod-device "$VERSION"

          # L3
          publish_crate svod-schedule
          wait_for_crate svod-schedule "$VERSION"

          # L4
          publish_crate svod-codegen
          wait_for_crate svod-codegen "$VERSION"

          # L5
          publish_crate svod-runtime
          wait_for_crate svod-runtime "$VERSION"

          # L6: svod-tensor + svod-arch (arch depends on svod-runtime)
          publish_crate svod-tensor &
          publish_crate svod-arch &
          wait
          wait_for_crate svod-tensor "$VERSION"
          wait_for_crate svod-arch "$VERSION"

          # L7: svod-tk + svod-onnx (no inter-dep); svod-tk must precede svod-model
          publish_crate svod-tk &
          publish_crate svod-onnx &
          wait
          wait_for_crate svod-tk "$VERSION"
          wait_for_crate svod-onnx "$VERSION"

          # L8: svod-model (depends on svod-tk)
          publish_crate svod-model
          wait_for_crate svod-model "$VERSION"
          echo "All crates published successfully!"

  release:
    name: Create GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Detect pre-release and build crates.io links
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"

          if echo "$VERSION" | grep -qE '(alpha|beta|rc)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          CRATES="svod-dtype svod-macros svod-arch svod-ir svod-device svod-schedule svod-codegen svod-runtime svod-tensor svod-tk svod-onnx svod-model"
          {
            echo "links<<EOF"
            echo "## Crates"
            echo ""
            for crate in $CRATES; do
              echo "- [\`$crate\`](https://crates.io/crates/$crate/$VERSION)"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          append_body: true
          body: ${{ steps.meta.outputs.links }}
