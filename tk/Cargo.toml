[package]
name = "svod-tk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "ThunderKittens-style tile DSL for authoring hand-tuned GPU kernels (gfx942)"
autobenches = false # explicit [[bench]] entries below; `benches/common.rs` is a shared module, not a bench

[dependencies]
svod-dtype = { path = "../dtype", version = "=0.1.0-alpha.6" }
svod-ir = { path = "../ir", version = "=0.1.0-alpha.6" }
svod-tensor = { path = "../tensor", version = "=0.1.0-alpha.6" }
smallvec = { workspace = true }
snafu = "0.9.2"
svod-codegen = { path = "../codegen", version = "=0.1.0-alpha.6" }
svod-device = { path = "../device", version = "=0.1.0-alpha.6" }
svod-runtime = { path = "../runtime", version = "=0.1.0-alpha.6" }
svod-schedule = { path = "../schedule", version = "=0.1.0-alpha.6" }

[dev-dependencies]
svod-schedule = { path = "../schedule", version = "=0.1.0-alpha.6", features = ["testing"] }
proptest = "1.9"
test-case = "3.3.1"
criterion = { version = "0.8", features = ["html_reports"] }
ndarray.workspace = true # native CPU baseline for the knn bench

# GPU device-time benches (criterion), one binary per kernel sharing `benches/common.rs`.
# Self-skip when no AMD GPU; run one with e.g. `SVOD_DEVICE=AMD:0 cargo bench -p svod-tk --bench knn`.
[[bench]]
name = "fa"
harness = false

[[bench]]
name = "kmeans"
harness = false

[[bench]]
name = "knn"
harness = false

[[bench]]
name = "matmul"
harness = false

[[bench]]
name = "sq_attention"
harness = false
