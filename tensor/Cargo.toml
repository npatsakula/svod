[package]
name = "svod-tensor"

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "High-level lazy tensor API for the Svod ML compiler"
readme = "README.md"

[dependencies]
svod-dtype = { path = "../dtype", version = "=0.2.0" }
svod-ir = { path = "../ir", version = "=0.2.0" }
svod-device = { path = "../device", version = "=0.2.0" }
svod-codegen = { path = "../codegen", version = "=0.2.0" }
svod-macros = { path = "../macros", version = "=0.2.0" }
svod-runtime = { path = "../runtime", version = "=0.2.0" }
svod-schedule = { path = "../schedule", version = "=0.2.0" }
snafu = "0.9"
bon = "3.10"
smallvec = { workspace = true }
ndarray.workspace = true
papaya = "0.2.3"
parking_lot = "0.12"
tracing = "0.1"
strum = { version = "0.28.0", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
serde_json = "1"
rayon = "1.12.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = "0.8"
test-case = "3.3.1"
svod-schedule = { path = "../schedule", version = "=0.2.0", features = [
  "testing",
] }
proptest = "1.11.0"
tempfile = "3.27.0"

[[bench]]
name = "optimization"
harness = false

[[bench]]
name = "conformer_ffn"
harness = false
