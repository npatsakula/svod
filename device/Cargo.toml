[package]
name = "svod-device"

version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Device abstraction layer for the Svod ML compiler"
readme = "README.md"

[dependencies]
svod-dtype = { path = "../dtype", version = "=0.1.0-alpha.7", features = ["serde"] }
svod-ir = { path = "../ir", version = "=0.1.0-alpha.7" }

ndarray.workspace = true

snafu = "0.9"
parking_lot = "0.12"
smallvec = { workspace = true }
tracing = "0.1"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }

proptest-derive = { version = "0.8", optional = true }
proptest = { version = "1.9", optional = true }
memmap2 = "0.9"
object = { version = "0.40", default-features = false, features = ["elf", "read"] }
libloading = "0.9"

# AMD GPU provider — always compiled on Unix (Linux + macOS); the KFD path is
# selected at runtime (the device registry registers the AMD factory only when
# a supported GPU is present). `nix` is unix-only, so these match the
# `cfg(unix)` gate on the `amd` module; Windows is out of scope.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["ioctl", "fs"] }

[target.'cfg(unix)'.build-dependencies]
bindgen = "0.73"

[dev-dependencies]
svod-dtype = { path = "../dtype", version = "=0.1.0-alpha.7", features = ["proptest"] }
proptest = "1.9"
strum = "0.28"
test-case = "3.3.1"

[features]
default = []
proptest = ["dep:proptest", "dep:proptest-derive", "svod-dtype/proptest"]
