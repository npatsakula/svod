[package]
name = "svod-model"
authors.workspace = true
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Ready-to-run model implementations (ASR, embeddings, vision) for the Svod ML compiler"

[dependencies]
base64 = "0.23"
bon = "3.10"
hf-hub = { version = "1.0", features = ["blocking"] }
hound = "3.5.1"
svod-arch = { path = "../arch", version = "=0.1.0-alpha.7" }
svod-device = { path = "../device", version = "=0.1.0-alpha.7" }
svod-dtype = { path = "../dtype", version = "=0.1.0-alpha.7" }
svod-ir = { path = "../ir", version = "=0.1.0-alpha.7" }
svod-macros = { path = "../macros", version = "=0.1.0-alpha.7" }
svod-runtime = { path = "../runtime", version = "=0.1.0-alpha.7" }
svod-tensor = { path = "../tensor", version = "=0.1.0-alpha.7" }
svod-tk = { path = "../tk", version = "=0.1.0-alpha.7" }
ndarray.workspace = true
prost = "0.14.3"
nom = "8.0"
repugnant-pickle = { version = "0.0.1", features = ["torch"] }
safetensors = "0.8"
zip = { version = "8", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
snafu = "0.9.0"
tracing-subscriber = "0.3.23"
tracing = "0.1.44"
bytemuck = "1.25.0"
flate2 = "1.1.10"
rand = "0.10"
rustc-hash = "2"
tiktoken-rs = "0.12"
wide = "1.7"
fearless_simd = "0.7.0"

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }
svod-schedule = { path = "../schedule", version = "=0.1.0-alpha.7", features = ["testing"] }
ndarray-npy = "0.10"
tempfile = "3.27.0"
test-case = "3.3.1"
