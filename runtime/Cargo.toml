[package]
name = "svod-runtime"

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Kernel execution runtime for the Svod ML compiler"
readme = "README.md"

[dependencies]
svod-dtype = { path = "../dtype", version = "=0.1.1" }
svod-device = { path = "../device", version = "=0.1.1" }
svod-ir = { path = "../ir", version = "=0.1.1" }
svod-codegen = { path = "../codegen", version = "=0.1.1" }
svod-schedule = { path = "../schedule", version = "=0.1.1" }
snafu = "0.9"
parking_lot = "0.12"
libc = "0.2"
papaya = "0.2.3"
rayon = "1.11"
tracing = "0.1"
libloading = "0.9"
tempfile = { version = "3", optional = true }
object = { version = "0.40", default-features = false, features = ["elf", "read"] }
sha2 = "0.11"
memmap2 = "0.9"
libffi = "5.1.0"
smallvec = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
test-case = "3.3.1"
tempfile = "3"

[features]
default = []
dlopen-fallback = ["dep:tempfile"]
