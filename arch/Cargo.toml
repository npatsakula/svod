[package]
name = "svod-arch"

version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-side speech decoding for Svod: CTC and RNN-T decoders, VAD-driven chunking, and a long-form ASR pipeline"

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
snafu = "0.9"
svod-ir = { path = "../ir", version = "=0.1.0" }
svod-runtime = { path = "../runtime", version = "=0.1.0" }

[dev-dependencies]
proptest = "1.9"
serde_json = "1.0"
test-case = "3.3.1"

[features]
default = ["serde"]
serde = ["dep:serde"]
